name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build clang
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Configure POSIX
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build --parallel 3
      - name: CPU and catalog regression
        run: ctest --test-dir build --output-on-failure -E rsx.d3d12
      - name: Compile the production runner against our own ELF fixture
        run: |
          python external/ps3recomp/tools/wrap_spu_elf.py build/tests/generated/spu.bin --base 0 --entry 0 --out build/tests/generated/spu.elf
          python external/ps3recomp/tools/build_spu_workloads.py --input build/tests/generated/ppu.elf --input build/tests/generated/spu.elf --lifted build/tests/spu --out build/tests/spu/spu_workloads.c --constructor --merge-chunks
          cmake -S . -B build -DPS3_NATIVE_RECOMP_DIR="${{ github.workspace }}/build/tests/generated" -DPS3_NATIVE_SPU_DIR="${{ github.workspace }}/build/tests/spu"
          cmake --build build --target ps3-native-module --parallel 3
      - name: Bind and execute the production runner fixture
        run: |
          python src/ps3native/cli.py prepare build/tests/generated/ppu.elf --bind-native --elf build/tests/generated/ppu.elf --aot-dir build/tests/generated
          python src/ps3native/cli.py run build/tests/generated/ppu.elf
      # Hosted Windows runners have no certified D3D12 adapter. Run the mandatory
      # real-pixel RSX test locally on a GPU host: ctest --test-dir build -R rsx.
